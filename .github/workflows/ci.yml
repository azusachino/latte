name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No required checks are configured. If make check becomes required,
    # use an always-running status gate instead of skipping the workflow.
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - 'docs/**'
      - 'specs/**'

permissions:
  contents: read

# Main run IDs are unique so queued main commits are preserved as well.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.5.12

      - name: Cache Gradle dependencies and build state
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Same-repository PRs can reuse their own cache during iteration.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

      - name: Check Markdown formatting
        run: make md-check

      - name: Unit tests, Android lint and debug APK
        run: mise exec -- gradle --build-cache testDebugUnitTest lintDebug assembleDebug

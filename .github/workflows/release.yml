name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.5.12

      - name: Run tests
        run: make check

      - name: Run Android lint
        run: make lint

      - name: Build Android Release APK
        run: mise exec -- gradle assembleRelease

      - name: Prepare release artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/latte-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/latte-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false

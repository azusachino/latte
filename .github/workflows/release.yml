name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Run tests
        run: make check

      - name: Build Android Release APK
        run: ./gradlew assembleRelease

      - name: Prepare release artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/latte-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/latte-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false

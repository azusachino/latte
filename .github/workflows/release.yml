name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.5.12

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

      - name: Run tests
        run: make check

      - name: Run Android lint
        run: make lint

      - name: Decode Release Keystore
        if: ${{ env.LATTE_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "$LATTE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
        env:
          LATTE_KEYSTORE_BASE64: ${{ secrets.LATTE_KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        run: mise exec -- gradle assembleRelease
        env:
          LATTE_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          LATTE_KEYSTORE_PASSWORD: ${{ secrets.LATTE_KEYSTORE_PASSWORD }}
          LATTE_KEY_ALIAS: ${{ secrets.LATTE_KEY_ALIAS }}
          LATTE_KEY_PASSWORD: ${{ secrets.LATTE_KEY_PASSWORD }}

      - name: Prepare release artifact & checksums
        run: |
          mkdir -p dist
          APK_NAME="latte-${{ github.ref_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          cd dist
          sha256sum "$APK_NAME" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/latte-${{ github.ref_name }}.apk
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
